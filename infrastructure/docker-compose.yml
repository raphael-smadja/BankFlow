services:

  postgres:
    image: postgres:17
    container_name: bankflow-postgres

    environment:
      POSTGRES_USER: bankflow
      POSTGRES_PASSWORD: bankflow
      POSTGRES_DB: bankflow

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - bankflow-network

  # Base de données du notification-service
  notification-postgres:
    image: postgres:17
    container_name: bankflow-notification-postgres

    environment:
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password
      POSTGRES_DB: notification_db

    ports:
      - "5433:5432"

    volumes:
      - notification-postgres-data:/var/lib/postgresql/data

    networks:
      - bankflow-network


  kafka:
    image: apache/kafka:latest
    container_name: bankflow-kafka

    ports:
      - "9094:9094"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    networks:
      - bankflow-network


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bankflow-kafka-ui

    ports:
      - "8090:8080"

    environment:

      KAFKA_CLUSTERS_0_NAME: bankflow

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka

    networks:
      - bankflow-network


volumes:

  postgres-data:


networks:

  bankflow-network:

    driver: bridge

